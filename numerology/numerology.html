<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.line-scdn.net https://www.gstatic.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; connect-src 'self' https: wss: blob:; worker-src 'self' blob:; frame-src https://liff.line.me https://access.line.me; font-src 'self' data:; base-uri 'self'; form-action 'self' https://payment.ecpay.com.tw https://payment-stage.ecpay.com.tw https://*.ecpay.com.tw;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>律動能量 | 命運解碼室</title>
    <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
    
    <div id="pixi-container">
        <div id="digit-fx-layer" aria-hidden="true"></div>
    </div>

    <div id="ui-layer">
        
        <div id="step-calibration" class="screen active">
            <p class="status-text">同步星軌數據中...</p>
        </div>

        <div id="step-ritual" class="screen hidden">
            <h1 style="color: #E5C07B; font-size: 24px; margin-bottom: 30px; text-shadow: 0 0 10px rgba(212,175,55,0.5); text-align: center;">
                歡迎來到數字解碼，<br><span id="ui-name" style="color: #fff; font-size: 20px;"></span>
            </h1>
            <button id="btn-activate" class="glow-button">
                啟動律動能量 <br>
                <span class="cost-text" style="color: rgba(255,255,255,0.6);">(服務準備中...)</span>
            </button>
        </div>
    </div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="/pixi.min.js"></script> 
    <script src="/env.js?v=8"></script>      
    <script src="/liff-mobile-only.js?v=1"></script>
    <script src="/js/liff-bootstrap.js?v=3"></script>
    <script src="main_logic.js?v=12"></script>  
    <canvas id="share-canvas" width="1080" height="1920" style="display: none;"></canvas>
</body>
</html>
