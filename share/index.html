<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://static.line-scdn.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; connect-src 'self' https: wss: blob:; worker-src 'self' blob:; frame-src https://liff.line.me https://access.line.me; font-src 'self' data:; base-uri 'self';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>分享解盤｜命運解碼室</title>
    <style>
        :root { --gold: #D4AF37; --bg: #050508; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; background: var(--bg); color: #e8e8e8;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            display: flex; align-items: center; justify-content: center; padding: 24px 16px;
        }
        .panel {
            width: 100%; max-width: 400px; text-align: center;
        }
        h1 { color: var(--gold); font-size: 20px; font-weight: 600; margin: 0 0 8px; letter-spacing: 1px; }
        .hint { color: #aaa; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
        .preview {
            text-align: left; background: rgba(255,255,255,0.05); border: 1px solid rgba(212,175,55,0.25);
            border-radius: 12px; padding: 14px; max-height: 40vh; overflow-y: auto;
            font-size: 13px; line-height: 1.65; color: #ccc; white-space: pre-wrap; margin-bottom: 24px;
        }
        .btn-share {
            width: 100%; padding: 16px; border: none; border-radius: 28px;
            background: linear-gradient(135deg, #D4AF37, #8B6914); color: #1a1200;
            font-size: 17px; font-weight: bold; cursor: pointer;
        }
        .btn-share:disabled { opacity: 0.5; cursor: not-allowed; }
        .status { margin-top: 16px; font-size: 13px; color: #888; min-height: 1.2em; }
        .status.err { color: #ff6b6b; }
        .loader { color: var(--gold); font-size: 14px; }
    </style>
</head>
<body>
    <div class="panel" id="app">
        <p class="loader" id="loader">載入解盤內容中…</p>
        <div id="main" style="display:none;">
            <h1>分享給好友</h1>
            <p class="hint">以下為即將傳送的內容預覽（含完整解盤與官方帳號邀請）</p>
            <div class="preview" id="preview"></div>
            <button type="button" class="btn-share" id="btn-share">選擇分享對象</button>
            <p class="status" id="status"></p>
        </div>
    </div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="/env.js?v=9"></script>
    <script src="/liff-mobile-only.js?v=1"></script>
    <script src="/js/liff-bootstrap.js?v=1"></script>
    <script src="share.js?v=1"></script>
</body>
</html>
