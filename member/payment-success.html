<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://static.line-scdn.net https://www.gstatic.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; connect-src 'self' https://bastro-bot-217800246535.asia-east1.run.app https://api.line.me https://liff.line.me https://access.line.me https://static.line-scdn.net https://profile.line-scdn.net https://*.googleapis.com https://*.google.com https://securetoken.googleapis.com https://identitytoolkit.googleapis.com; frame-src https://liff.line.me https://access.line.me; font-src 'self' data:; base-uri 'self'; form-action 'self' https://payment.ecpay.com.tw https://payment-stage.ecpay.com.tw https://*.ecpay.com.tw;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>儲值成功｜命運解碼室</title>
    <script src="/env.js?v=8"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="/liff-mobile-only.js?v=1"></script>
    <style>
        :root { --gold: #D4AF37; --gold-light: #F9E498; --bg-deep: #050508; }
        * { box-sizing: border-box; font-family: 'PingFang TC', 'Noto Serif TC', serif; }
        body { margin: 0; min-height: 100vh; background: var(--bg-deep); color: #fff; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .card {
            max-width: 400px; width: 100%; text-align: center;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(212,175,55,0.35);
            border-radius: 16px; padding: 32px 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .icon { font-size: 48px; margin-bottom: 12px; }
        h1 { margin: 0 0 8px; font-size: 22px; color: var(--gold-light); letter-spacing: 2px; }
        .sub { font-size: 14px; color: #aaa; line-height: 1.6; margin-bottom: 20px; }
        .detail { font-size: 15px; color: #ddd; margin: 16px 0; min-height: 48px; }
        .points { font-size: 36px; font-weight: bold; color: var(--gold-light); text-shadow: 0 0 16px var(--gold); }
        .btn {
            display: block; width: 100%; margin-top: 12px; padding: 12px; border-radius: 24px;
            font-weight: bold; font-size: 14px; cursor: pointer; text-decoration: none;
        }
        .btn-primary { background: linear-gradient(135deg, var(--gold), #B8860B); color: #000; border: none; }
        .btn-ghost { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
        .spinner { width: 40px; height: 40px; margin: 12px auto; border: 3px solid rgba(212,175,55,0.3); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon" id="state-icon">✨</div>
        <h1 id="title">確認入帳中</h1>
        <p class="sub" id="subtitle">已收到付款通知，靈力將於數秒內入帳。請稍候…</p>
        <div class="detail" id="detail"><div class="spinner"></div></div>
        <a class="btn btn-primary" id="btn-profile" href="#" style="display:none;">返回會員中心</a>
        <a class="btn btn-ghost" href="/index.html" style="margin-top:8px;">查看服務說明</a>
    </div>

    <script>
        const params = new URLSearchParams(location.search);
        const orderId = params.get('order') || sessionStorage.getItem('bd_pending_order') || '';
        document.getElementById('btn-profile').href = 'https://liff.line.me/' + ENV.MEMBER_LIFF_ID;

        let accessToken = null;
        let pollTimer = null;
        let pollCount = 0;
        const MAX_POLL = 30;

        function setDetailSpinner() {
            const detail = document.getElementById('detail');
            detail.replaceChildren();
            detail.appendChild(document.createElement('div')).className = 'spinner';
        }

        function setDetailSuccess(pointsGiven, amount) {
            const detail = document.getElementById('detail');
            detail.replaceChildren();
            const p1 = document.createElement('p');
            p1.textContent = '獲得';
            detail.appendChild(p1);
            const p2 = document.createElement('p');
            p2.className = 'points';
            p2.textContent = '+' + pointsGiven;
            detail.appendChild(p2);
            const p3 = document.createElement('p');
            p3.style.fontSize = '13px';
            p3.style.color = '#888';
            p3.textContent = '靈力 · NT$ ' + amount;
            detail.appendChild(p3);
        }

        function setDetailOrderLine(labelPrefix) {
            const detail = document.getElementById('detail');
            detail.replaceChildren();
            const p = document.createElement('p');
            p.style.fontSize = '12px';
            p.style.color = '#888';
            p.textContent = labelPrefix + orderId;
            detail.appendChild(p);
        }

        function setState(kind, title, sub, detailMode) {
            const icons = { pending: '⏳', success: '🎉', timeout: '⏳', error: '⚠️' };
            document.getElementById('state-icon').textContent = icons[kind] || '✨';
            document.getElementById('title').textContent = title;
            document.getElementById('subtitle').textContent = sub;
            if (detailMode === 'spinner') setDetailSpinner();
            else if (detailMode === 'order') setDetailOrderLine('訂單：');
            else document.getElementById('detail').replaceChildren();
            if (kind === 'success' || kind === 'timeout') {
                document.getElementById('btn-profile').style.display = 'block';
            }
        }

        async function initLiff() {
            await liff.init({ liffId: ENV.MEMBER_LIFF_ID });
            if (!liff.isLoggedIn()) {
                liff.login({ redirectUri: location.href });
                return false;
            }
            accessToken = liff.getAccessToken();
            return true;
        }

        async function pollOrderStatus() {
            if (!orderId || !accessToken) return;
            pollCount += 1;
            try {
                const res = await fetch(ENV.API_BASE + '/api/pay/order-status?orderId=' + encodeURIComponent(orderId), {
                    headers: { Authorization: 'Bearer ' + accessToken },
                });
                const data = await res.json();
                if (!data.success) {
                    if (res.status === 404 && pollCount < 5) return;
                    throw new Error(data.msg || '查詢失敗');
                }
                if (data.status === 'success') {
                    clearInterval(pollTimer);
                    sessionStorage.removeItem('bd_pending_order');
                    setState('success', '儲值成功', '靈力已入帳，感謝您的支持。', 'none');
                    setDetailSuccess(data.pointsGiven, data.amount);
                    return;
                }
                if (pollCount >= MAX_POLL) {
                    clearInterval(pollTimer);
                    setState(
                        'timeout',
                        '入帳處理中',
                        '若已扣款，靈力通常會在數分鐘內入帳。可返回會員中心查看餘額，或聯絡客服。',
                        'order'
                    );
                }
            } catch (e) {
                if (pollCount >= MAX_POLL) {
                    clearInterval(pollTimer);
                    setState('error', '無法確認狀態', '請返回會員中心查看靈力餘額，或稍後再試。', 'none');
                }
            }
        }

        async function main() {
            if (!orderId) {
                setState('error', '缺少訂單資訊', '請從會員中心重新儲值。', 'none');
                document.getElementById('btn-profile').style.display = 'block';
                return;
            }
            try {
                const ok = await initLiff();
                if (!ok) return;
                setDetailSpinner();
                pollTimer = setInterval(pollOrderStatus, 2000);
                pollOrderStatus();
            } catch (e) {
                setState(
                    'timeout',
                    '儲值完成',
                    '若您已完成付款，請在 LINE 內開啟會員中心確認靈力餘額。',
                    'order'
                );
                document.getElementById('btn-profile').style.display = 'block';
            }
        }

        document.addEventListener('DOMContentLoaded', main);
    </script>
</body>
</html>
