<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.line-scdn.net https://www.gstatic.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; connect-src 'self' https: wss: blob:; worker-src 'self' blob:; frame-src https://liff.line.me https://access.line.me; font-src 'self' data:; base-uri 'self'; form-action 'self' https://payment.ecpay.com.tw https://payment-stage.ecpay.com.tw https://*.ecpay.com.tw;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>命運解碼室 | 紫微大運</title>
    
    <script src="/env.js?v=8"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="/liff-mobile-only.js?v=1"></script>
    <script src="/js/liff-bootstrap.js?v=3"></script>
    <script src="/pixi.min.js"></script>
    
    <style>
        :root {
            --bg-color: #0A0B10;
            --gold: #D4AF37;
            --gold-light: #F9E498;
            --gray: #333;
        }

        body {
            margin: 0; padding: 0; background: transparent; color: #E0E0E0;
            font-family: 'PingFang TC', 'Noto Serif TC', serif; 
            overflow: hidden; height: 100vh; position: relative;
        }

        /* 🌟 PixiJS 全局背景畫布 */
        #pixi-background { 
            position: absolute; 
            inset: 0; 
            z-index: 0; 
            background-color: var(--bg-color);
            transform: translate3d(0, 0, 0);
            -webkit-transform: translate3d(0, 0, 0);
        }

        /* 🔮 步驟容器 */
        .step-section {
            position: absolute; top: 50%; left: 50%; width: 90%; max-width: 400px; text-align: center; z-index: 10;
            transform: translate(-50%, -30%); opacity: 0; pointer-events: none;
            transition: all 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
            background: rgba(10, 11, 16, 0.18); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
            padding: 30px 20px; border-radius: 16px; border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 10px 35px rgba(0,0,0,0.4);
        }
        .step-section.active { transform: translate(-50%, -50%); opacity: 1; pointer-events: auto; }
        .step-section.exit-up { transform: translate(-50%, -70%); opacity: 0; pointer-events: none; }

        h2 { color: var(--gold); font-weight: 300; letter-spacing: 2px; margin-bottom: 25px; line-height: 1.6; text-shadow: 0 0 10px rgba(212, 175, 55, 0.3); margin-top: 0;}
        .subtitle { font-size: 14px; color: #aaa; margin-bottom: 20px; letter-spacing: 1px; }

        .btn-choice {
            display: block; width: 100%; padding: 18px; margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.4); border-radius: 12px;
            color: var(--gold-light); font-size: 18px; letter-spacing: 2px;
            cursor: pointer; transition: all 0.3s;
        }
        .btn-choice:active, .btn-choice.selected {
            background: rgba(212, 175, 55, 0.2); border-color: var(--gold);
            transform: scale(0.98); box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        .form-group { margin-bottom: 20px; text-align: left; }
        .form-label { display: block; font-size: 12px; color: #ccc; margin-bottom: 8px; padding-left: 5px; }
        
        .date-group { display: flex; gap: 8px; }
        .date-group select { flex: 1; text-align-last: center; }

        select {
            width: 100%; padding: 15px; box-sizing: border-box;
            background: rgba(0,0,0,0.8); border: 1px solid var(--gray);
            color: var(--gold-light); font-size: 16px; border-radius: 8px;
            color-scheme: dark; appearance: none; transition: all 0.3s;
        }
        select:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 10px rgba(212,175,55,0.2); }

        /* ✨ 勾選框樣式 */
        .checkbox-wrapper { margin-top: 12px; padding-left: 5px; }
        .checkbox-label { display: flex; align-items: center; color: #aaa; font-size: 13px; cursor: pointer; transition: color 0.3s; }
        .checkbox-label:hover { color: var(--gold-light); }
        .checkbox-label input[type="checkbox"] { 
            appearance: none; width: 18px; height: 18px; border: 1px solid var(--gray); border-radius: 4px; 
            margin-right: 10px; background: rgba(0,0,0,0.5); cursor: pointer; position: relative;
        }
        .checkbox-label input[type="checkbox"]:checked {
            background: var(--gold); border-color: var(--gold);
        }
        .checkbox-label input[type="checkbox"]:checked::after {
            content: '✓'; position: absolute; color: #000; font-size: 14px; font-weight: bold;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
        }

        .btn-submit {
            width: 100%; padding: 18px; margin-top: 15px;
            background: linear-gradient(135deg, #D4AF37, #AA7C11);
            border: none; border-radius: 8px;
            color: #000; font-size: 18px; font-weight: bold; letter-spacing: 2px;
            cursor: pointer; box-shadow: 0 5px 20px rgba(212, 175, 55, 0.4);
            transition: transform 0.2s;
        }
        .btn-submit:active { transform: scale(0.96); }
        .btn-submit:disabled { background: #555; color: #888; cursor: not-allowed; box-shadow: none; }

        /* ==========================================
           🌌 Loading 滿版遮罩與排版
           ========================================== */
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(10, 11, 16, 0.4); 
            z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            opacity: 0; pointer-events: none; transition: opacity 0.8s ease;
            backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
        }
        #loading-overlay.show { opacity: 1; pointer-events: auto; }

        /* ==========================================
           🔮 尊爵版紫微 Loading 動畫
           ========================================== */
        .ritual-container {
            width: 280px; height: 280px; margin-bottom: 50px;
            position: relative; display: flex; justify-content: center; align-items: center;
        }
        .core-nebula {
            width: 60px; height: 60px; 
            background: radial-gradient(circle, #ce93d8 0%, #8e24aa 50%, transparent 100%);
            border-radius: 50%;
            position: absolute; z-index: 1; 
            animation: textPulse 1s infinite;
        }
        .magic-chart {
            width: 100%; height: 100%; object-fit: contain;
            position: absolute; z-index: 2; 
            animation: rotate-chart 15s linear infinite;
        }
        @keyframes rotate-chart {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loading-msg {
            color: var(--gold-light); font-size: 18px; letter-spacing: 4px; font-weight: bold; text-align: center;
            background: rgba(0, 0, 0, 0.6); padding: 15px 30px; border-radius: 30px;
            border: 1px solid rgba(212,175,55,0.3); animation: textPulse 2s infinite; 
        }
        @keyframes textPulse { 
            0%, 100% { opacity: 0.8; text-shadow: 0 0 5px rgba(212, 175, 55, 0.2); box-shadow: 0 0 0px rgba(212, 175, 55, 0); } 
            50% { opacity: 1; text-shadow: 0 0 20px var(--gold); box-shadow: 0 0 20px rgba(212, 175, 55, 0.3); } 
        }

        /* ==========================================
           🌌 沉浸式確認彈窗
           ========================================== */
        #custom-confirm-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
            z-index: 999; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        #custom-confirm-overlay.show { opacity: 1; pointer-events: auto; }
        
        .confirm-box {
            background: #111; border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px; width: 85%; max-width: 320px;
            padding: 25px 20px; text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 20px rgba(212,175,55,0.1) inset;
            transform: scale(0.95); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #custom-confirm-overlay.show .confirm-box { transform: scale(1); }
        
        .confirm-title { color: var(--gold); font-size: 18px; font-weight: bold; margin-bottom: 12px; letter-spacing: 2px; }
        .confirm-desc { color: #ccc; font-size: 14px; line-height: 1.6; margin-bottom: 25px; }
        .confirm-cost { color: var(--gold-light); font-weight: bold; font-size: 16px; margin: 8px 0; background: rgba(212,175,55,0.1); display: inline-block; padding: 4px 12px; border-radius: 20px;}
        
        .confirm-actions { display: flex; gap: 12px; }
        .btn-confirm-cancel, .btn-confirm-ok {
            flex: 1; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; border: none; letter-spacing: 1px;
        }
        .btn-confirm-cancel { background: rgba(255,255,255,0.1); color: #aaa; }
        .btn-confirm-cancel:active { background: rgba(255,255,255,0.2); }
        .btn-confirm-ok { background: linear-gradient(135deg, #D4AF37, #AA7C11); color: #000; }
        .btn-confirm-ok:active { opacity: 0.8; }
    </style>
</head>
<body>
    <div id="pixi-background"></div>

    <div id="step-1" class="step-section active">
        <h2>請鎖定欲窺探之<br>天命領域</h2>
        <div class="subtitle">大師將為您降下專屬格局指引</div>
        <button class="btn-choice" onclick="makeChoice(1, 'topic', '本命格局', this)">🏮 本命先天格局</button>
        <button class="btn-choice" onclick="makeChoice(1, 'topic', '事業財富', this)">💰 事業財富版圖</button>
        <button class="btn-choice" onclick="makeChoice(1, 'topic', '感情婚姻', this)">🌸 感情姻緣軌跡</button>
        <button class="btn-choice" onclick="makeChoice(1, 'topic', '2026流年', this)">📅 2026 流年大運</button>
    </div>

    <div id="step-2" class="step-section">
        <h2>命運的齒輪<br>從陰陽開始轉動</h2>
        <div class="subtitle">請選擇您的生理性別</div>
        <button class="btn-choice" onclick="makeChoice(2, 'gender', 'M', this)">乾造 (男命)</button>
        <button class="btn-choice" onclick="makeChoice(2, 'gender', 'F', this)">坤造 (女命)</button>
    </div>

    <div id="step-3" class="step-section">
        <h2>您習慣仰望太陽<br>還是追隨月亮的軌跡？</h2>
        <div class="subtitle">請選擇星辰曆法</div>
        <button class="btn-choice" onclick="makeChoice(3, 'calendar', 'solar', this)">太陽曆 (國曆)</button>
        <button class="btn-choice" onclick="makeChoice(3, 'calendar', 'lunar', this)">太陰曆 (農曆)</button>
    </div>

    <div id="step-4" class="step-section">
        <h2>鎖定您的時空座標</h2>
        <div class="form-group">
            <label class="form-label">降生之日</label>
            <div class="date-group">
                <select id="input-year"></select>
                <select id="input-month"></select>
                <select id="input-day"></select>
            </div>
        </div>
        
        <div class="form-group">
            <label class="form-label">降生時辰</label>
            <select id="input-time"></select>
            <div class="checkbox-wrapper">
                <label class="checkbox-label">
                    <input type="checkbox" id="toggle-fuzzy-time">
                    不知確切時辰，申請大師區間定盤
                </label>
            </div>
        </div>

        <button id="btn-submit-main" class="btn-submit" onclick="submitAstrolabe()">啟動 108 星曜解碼</button>
    </div>


    <div id="loading-overlay">
        <div class="ritual-container">
            <div class="core-nebula"></div>
            <img src="/images/ziwei_ritual_chart.png" alt="紫微星辰陣" class="magic-chart">
        </div>
        <div id="loading-msg">構築 12 宮位星辰網格...</div>
    </div>

    <div id="custom-confirm-overlay">
        <div class="confirm-box">
            <div class="confirm-title" id="confirm-title">【🏮 紫微天命羅盤】</div>
            <div class="confirm-desc" id="confirm-desc"></div>
            <div class="confirm-actions">
                <button class="btn-confirm-cancel" onclick="closeCustomConfirm()">取消</button>
                <button class="btn-confirm-ok" onclick="executeCustomConfirm()">確認啟動</button>
            </div>
        </div>
    </div>

    <script>
        // 🌟 讓前端去後端問現在的價格 (強制破除快取版)
        async function fetchAiConfig() {
            try {
                const response = await fetch(`${ENV.API_BASE}/api/public/config/ai?t=${Date.now()}`);
                const result = await response.json();
                console.log("🔥 [CTO 雷達] 取得後台動態定價:", result); 
                if (result.success && result.data) {
                    if (result.data.ziwei !== undefined) window.ziweiCost = parseInt(result.data.ziwei.cost);
                }
            } catch (e) { console.error("🚨 [CTO 雷達] 無法取得動態定價:", e); }
        }
        
        // 🌌 沉浸式彈窗控制器 (修復版)
        let confirmActionCallback = null;

        function showCustomConfirm(title, desc, cost, callback) {
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-desc').innerHTML = `
                ${desc}<br>
                <div class="confirm-cost">消耗靈力：<span id="confirm-cost-value">${cost}</span> 點</div>
            `;
            confirmActionCallback = callback;
            document.getElementById('custom-confirm-overlay').classList.add('show');
        }

        function closeCustomConfirm() {
            document.getElementById('custom-confirm-overlay').classList.remove('show');
            confirmActionCallback = null; 
        }

        function executeCustomConfirm() {
            document.getElementById('custom-confirm-overlay').classList.remove('show');
            if (confirmActionCallback) {
                const action = confirmActionCallback; 
                confirmActionCallback = null; 
                action(); 
            }
        }

        // 🌟 新增 topic 變數
        const userAstrolabeData = { topic: '', gender: '', calendar: '', date: '', time: '' };
        let currentAccessToken = "";
        let lineUserIdForTracking = "";
        let liffReady = false; 
        let pixiApp;
        let astrolabeGrid, astrolabeCore;
        let isCalculating = false; 
        const particles = [];
        
        // 🌟 特效額外變數
        let shakeAmount = 0;
        let shockwave = null;
        let spinSpeed = 0.001;
        const shootingStars = [];
        const orbitDust = [];

        // --- 🔮 動態時辰選單資料 ---
        const preciseTimes = [
            {v: '子', t: '子時 (23:00 - 00:59)'}, {v: '丑', t: '丑時 (01:00 - 02:59)'},
            {v: '寅', t: '寅時 (03:00 - 04:59)'}, {v: '卯', t: '卯時 (05:00 - 06:59)'},
            {v: '辰', t: '辰時 (07:00 - 08:59)'}, {v: '巳', t: '巳時 (09:00 - 10:59)'},
            {v: '午', t: '午時 (11:00 - 12:59)'}, {v: '未', t: '未時 (13:00 - 14:59)'},
            {v: '申', t: '申時 (15:00 - 16:59)'}, {v: '酉', t: '酉時 (17:00 - 18:59)'},
            {v: '戌', t: '戌時 (19:00 - 20:59)'}, {v: '亥', t: '亥時 (21:00 - 22:59)'}
        ];
        const fuzzyTimes = [
            {v: '清晨', t: '清晨破曉 (約 05:00 - 11:00)'},
            {v: '午後', t: '午後日輪 (約 11:00 - 17:00)'},
            {v: '傍晚', t: '傍晚暮色 (約 17:00 - 23:00)'},
            {v: '深夜', t: '深夜星辰 (約 23:00 - 05:00)'}
        ];

        function populateTimeOptions(isFuzzy) {
            const timeSelect = document.getElementById('input-time');
            timeSelect.innerHTML = '';
            const options = isFuzzy ? fuzzyTimes : preciseTimes;
            options.forEach(opt => { timeSelect.add(new Option(opt.t, opt.v)); });
            timeSelect.style.borderColor = 'var(--gold-light)';
            setTimeout(() => timeSelect.style.borderColor = 'var(--gray)', 400);
        }

        // --- 🌌 PixiJS 全域特效 ---
        let bgFxInitPending = false;
        function scheduleBackgroundFxInit() {
            if (pixiApp) return;
            if (bgFxInitPending) return;
            bgFxInitPending = true;
            const run = () => {
                bgFxInitPending = false;
                try {
                    initPixiBackground();
                } catch (pixiErr) {
                    console.error("Pixi 背景初始化失敗", pixiErr);
                }
            };
            if (typeof window.requestAnimationFrame === 'function') {
                requestAnimationFrame(() => requestAnimationFrame(run));
            } else {
                setTimeout(run, 50);
            }
        }

        function initPixiBackground() {
            if (pixiApp) return;

            const container = document.getElementById('pixi-background');
            if (!container) {
                console.warn("Pixi: 找不到 #pixi-background");
                return;
            }
            if (typeof PIXI === "undefined") {
                console.warn("Pixi: PIXI 未載入（請確認 /pixi.min.js）");
                return;
            }

            const w = window.innerWidth || document.documentElement.clientWidth || 360;
            const h = window.innerHeight || document.documentElement.clientHeight || 640;
            if (w < 2 || h < 2) {
                console.warn("Pixi: 視窗尺寸尚未就緒，稍後重試");
                scheduleBackgroundFxInit();
                return;
            }

            pixiApp = new PIXI.Application({ 
                resizeTo: window, 
                backgroundColor: 0x0A0B10, 
                transparent: false, 
                autoDensity: true, 
                resolution: Math.min(window.devicePixelRatio || 1, 2) 
            });

            const canvas = pixiApp.view;
            canvas.style.position = 'absolute';
            canvas.style.top = '0';
            canvas.style.left = '0';
            canvas.style.width = '100%';
            canvas.style.height = '100%';
            container.appendChild(canvas);

            const starContainer = new PIXI.Container();
            pixiApp.stage.addChild(starContainer);
            
            // 🌟 繁星背景：賦予個別的閃爍速度與相位
            for(let i=0; i<160; i++) {
                let star = new PIXI.Graphics();
                star.beginFill(0xFFFFFF, 1.0);
                star.drawCircle(0, 0, Math.random() * 1.5 + 0.3);
                star.endFill();
                star.x = Math.random() * pixiApp.screen.width;
                star.y = Math.random() * pixiApp.screen.height;
                star.vy = (Math.random() - 0.5) * 0.15;
                star.twinkleSpeed = 0.01 + Math.random() * 0.03;
                star.twinklePhase = Math.random() * Math.PI * 2;
                star.baseAlpha = Math.random() * 0.6 + 0.3;
                star.alpha = star.baseAlpha;
                starContainer.addChild(star);
            }

            const center = new PIXI.Container();
            center.x = pixiApp.screen.width / 2; center.y = pixiApp.screen.height / 2; 
            pixiApp.stage.addChild(center);

            astrolabeGrid = new PIXI.Graphics();
            astrolabeGrid.lineStyle(1.5, 0xD4AF37, 0.5); 
            astrolabeGrid.drawCircle(0, 0, 180);
            astrolabeGrid.lineStyle(1, 0xD4AF37, 0.3);
            astrolabeGrid.drawCircle(0, 0, 110);
            for(let i = 0; i < 12; i++) {
                const angle = (i * Math.PI) / 6;
                astrolabeGrid.lineStyle(1.5, 0xD4AF37, 0.4);
                astrolabeGrid.moveTo(Math.cos(angle) * 110, Math.sin(angle) * 110);
                astrolabeGrid.lineTo(Math.cos(angle) * 180, Math.sin(angle) * 180);
            }
            astrolabeGrid.alpha = 0.2; 
            center.addChild(astrolabeGrid);

            // 🌟 軌道黃金星砂 (Golden Orbit Dust)：圍繞著星盤旋轉
            const dustContainer = new PIXI.Container();
            center.addChild(dustContainer);
            for(let i=0; i<40; i++) {
                const dust = new PIXI.Graphics();
                dust.beginFill(0xD4AF37, Math.random() * 0.7 + 0.3);
                dust.drawCircle(0, 0, Math.random() * 1.5 + 0.5);
                dust.endFill();
                dust.orbitAngle = Math.random() * Math.PI * 2;
                dust.orbitRadius = 110 + Math.random() * 70; // 落在星盤同心圓內
                dust.orbitSpeed = (Math.random() * 0.003 + 0.001) * (Math.random() > 0.5 ? 1 : -1);
                dustContainer.addChild(dust);
                orbitDust.push(dust);
            }

            astrolabeCore = new PIXI.Graphics();
            astrolabeCore.beginFill(0x4A148C, 0.85); 
            astrolabeCore.drawCircle(0, 0, 35);
            astrolabeCore.endFill();
            astrolabeCore.lineStyle(2.5, 0xD8B4E2, 0.6);
            astrolabeCore.drawCircle(0, 0, 45);
            astrolabeCore.alpha = 0.3; 
            center.addChild(astrolabeCore);

            const elementColors = [0xFFD700, 0x4CAF50, 0x2196F3, 0xF44336, 0x795548]; 

            let tick = 0;
            pixiApp.ticker.add((delta) => {
                tick += delta;
                
                // 🌟 特效：星盤震動 (Screen Shake)
                if (shakeAmount > 0.1) {
                    center.x = pixiApp.screen.width / 2 + (Math.random() - 0.5) * shakeAmount;
                    center.y = pixiApp.screen.height / 2 + (Math.random() - 0.5) * shakeAmount;
                    shakeAmount *= 0.92; // 阻尼衰減
                } else {
                    center.x = pixiApp.screen.width / 2;
                    center.y = pixiApp.screen.height / 2;
                }

                // 🌟 背景繁星閃爍與飄移
                starContainer.children.forEach(star => {
                    if (star.twinkleSpeed) {
                        star.y += star.vy * delta;
                        star.alpha = star.baseAlpha + Math.sin(tick * star.twinkleSpeed + star.twinklePhase) * 0.25;
                        if (star.alpha < 0.15) star.alpha = 0.15;
                        if (star.alpha > 0.95) star.alpha = 0.95;
                        
                        if(star.y < 0) star.y = pixiApp.screen.height;
                        if(star.y > pixiApp.screen.height) star.y = 0;
                    }
                });

                // 🌟 隨機金色微流星劃過星空 (仿真漸層流星效果)
                if (!isCalculating && Math.random() < 0.015) {
                    const ss = new PIXI.Graphics();
                    // 頭部：最亮白且最粗
                    ss.lineStyle(2.5, 0xFFFFFF, 0.95);
                    ss.moveTo(0, 0);
                    ss.lineTo(-8, -3.6);
                    // 中前段：淡金色、略細
                    ss.lineStyle(1.8, 0xF9E498, 0.65);
                    ss.lineTo(-20, -9);
                    // 中後段：金黃色、更細
                    ss.lineStyle(1.2, 0xD4AF37, 0.35);
                    ss.lineTo(-32, -14.4);
                    // 尾部：極細淡金
                    ss.lineStyle(0.6, 0xD4AF37, 0.15);
                    ss.lineTo(-45, -20.25);

                    ss.x = Math.random() * pixiApp.screen.width;
                    ss.y = Math.random() * (pixiApp.screen.height * 0.5);
                    ss.vx = Math.random() * 5 + 5;
                    ss.vy = ss.vx * 0.45;
                    ss.life = 1.0;
                    starContainer.addChild(ss);
                    shootingStars.push(ss);
                }

                for (let i = shootingStars.length - 1; i >= 0; i--) {
                    const ss = shootingStars[i];
                    ss.x += ss.vx * delta;
                    ss.y += ss.vy * delta;
                    ss.life -= 0.018 * delta;
                    ss.alpha = ss.life;
                    if (ss.life <= 0 || ss.x > pixiApp.screen.width || ss.y > pixiApp.screen.height) {
                        starContainer.removeChild(ss);
                        shootingStars.splice(i, 1);
                    }
                }

                // 🌟 軌道黃金星砂運轉
                orbitDust.forEach(dust => {
                    dust.orbitAngle += dust.orbitSpeed * delta;
                    dust.x = Math.cos(dust.orbitAngle) * dust.orbitRadius;
                    dust.y = Math.sin(dust.orbitAngle) * dust.orbitRadius;
                    dust.alpha = 0.4 + Math.sin(tick * 0.03 + dust.orbitRadius) * 0.35;
                });

                if (!isCalculating) {
                    // 平時：極度慢速旋轉 + 網格透明度微弱呼吸起伏
                    spinSpeed = 0.001;
                    astrolabeGrid.rotation += spinSpeed * delta;
                    astrolabeGrid.alpha = 0.2 + Math.sin(tick * 0.03) * 0.06;
                    
                    astrolabeCore.scale.set(1 + Math.sin(tick * 0.05) * 0.05);
                    astrolabeCore.alpha = 0.3 + Math.sin(tick * 0.05) * 0.08;
                } else {
                    // 🌟 啟動時：加速旋轉與聚能爆發
                    spinSpeed = Math.min(0.06, spinSpeed + 0.0025 * delta);
                    astrolabeGrid.rotation += spinSpeed * delta;
                    
                    astrolabeGrid.alpha = Math.min(1.0, astrolabeGrid.alpha + 0.05);
                    astrolabeCore.alpha = Math.min(1.0, astrolabeCore.alpha + 0.05);
                    astrolabeCore.scale.set(1 + Math.sin(tick * 0.25) * 0.18); 

                    // 🌟 啟動金色衝擊波 (Shockwave ring)
                    if (!shockwave) {
                        shockwave = new PIXI.Graphics();
                        center.addChild(shockwave);
                        shockwave.radius = 45;
                        shockwave.maxRadius = Math.max(pixiApp.screen.width, pixiApp.screen.height) * 0.7;
                        shockwave.waveAlpha = 1.0;
                    }
                    
                    if (shockwave && shockwave.radius < shockwave.maxRadius) {
                        shockwave.clear();
                        shockwave.lineStyle(2.5, 0xD4AF37, shockwave.waveAlpha);
                        shockwave.drawCircle(0, 0, shockwave.radius);
                        shockwave.radius += 8.5 * delta;
                        shockwave.waveAlpha = 1.0 - (shockwave.radius / shockwave.maxRadius);
                    } else if (shockwave) {
                        center.removeChild(shockwave);
                        shockwave = null;
                    }

                    // 匯聚五行星光粒子
                    if (Math.random() < 0.25) {
                        const p = new PIXI.Graphics();
                        p.beginFill(elementColors[Math.floor(Math.random() * elementColors.length)], 0.95);
                        p.drawCircle(0, 0, 4.5);
                        p.endFill();
                        const spawnAngle = Math.random() * Math.PI * 2;
                        p.x = Math.cos(spawnAngle) * (pixiApp.screen.width / 2 + 120);
                        p.y = Math.sin(spawnAngle) * (pixiApp.screen.height / 2 + 120);
                        p.speed = 6.5 + Math.random() * 4.5;
                        center.addChild(p);
                        particles.push(p);
                    }

                    for (let i = particles.length - 1; i >= 0; i--) {
                        const p = particles[i];
                        const dist = Math.sqrt(p.x * p.x + p.y * p.y);
                        if (dist < 40) {
                            center.removeChild(p); particles.splice(i, 1);
                            astrolabeCore.scale.set(1.6); 
                            astrolabeGrid.rotation -= 0.06; 
                        } else {
                            p.x -= (p.x / dist) * p.speed * delta; p.y -= (p.y / dist) * p.speed * delta;
                        }
                    }
                }
            });
        }

        // 🕵️‍♂️ 隱形發報機
        async function sendTrackingLog(stageName) {
            if (!currentAccessToken || !lineUserIdForTracking) return;
            try {
                await fetch(`${ENV.API_BASE}/api/log/stage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${currentAccessToken}` },
                    body: JSON.stringify({ type: 'ziwei', stage: stageName })
                });
            } catch (e) { console.log("Tracking Error:", e); }
        }
        
        async function initLIFF() {
            try {
                const session = await BdLiff.requireLiffSession(ENV.ZIWEI_LIFF_ID, { withProfile: true });
                currentAccessToken = session.token;
                if (session.profile) lineUserIdForTracking = session.profile.userId;
                liffReady = true;
                sendTrackingLog("Stage 1: Page View");
            } catch (err) {
                if (err && (err.code === 'LIFF_LOGIN_REDIRECT' || err.code === 'LIFF_MOBILE_ONLY')) return;
                console.error('initLIFF', err);
                if (typeof liff !== 'undefined' && liff.isLoggedIn && liff.isLoggedIn()) {
                    const t = liff.getAccessToken();
                    if (t) {
                        currentAccessToken = t;
                        liffReady = true;
                        return;
                    }
                }
                alert("無法開啟結界，請在 LINE 內部開啟！");
            }
        }

        function initDatePicker() {
            const ySelect = document.getElementById('input-year');
            const mSelect = document.getElementById('input-month');
            const dSelect = document.getElementById('input-day');

            for(let i = 2015; i >= 1940; i--) {
                let opt = new Option(i + ' 年', i);
                if(i === 1990) opt.selected = true;
                ySelect.add(opt);
            }
            for(let i = 1; i <= 12; i++) {
                let val = i < 10 ? '0'+i : i;
                mSelect.add(new Option(val + ' 月', val));
            }
            function updateDays() {
                const y = parseInt(ySelect.value), m = parseInt(mSelect.value);
                const days = new Date(y, m, 0).getDate();
                const current = dSelect.value;
                dSelect.innerHTML = ''; 
                for(let i = 1; i <= days; i++) {
                    let val = i < 10 ? '0'+i : i;
                    dSelect.add(new Option(val + ' 日', val));
                }
                if(current && current <= days) dSelect.value = current;
            }
            ySelect.onchange = mSelect.onchange = updateDays;
            updateDays();
        }

        async function initAll() {
            if (window.__ziweiInitStarted) return;
            window.__ziweiInitStarted = true;
            
            initDatePicker();
            populateTimeOptions(false);
            document.getElementById('toggle-fuzzy-time').addEventListener('change', (e) => {
                populateTimeOptions(e.target.checked);
            });
            
            // 🌟 啟動多重背景初始化防護
            scheduleBackgroundFxInit();
            window.addEventListener('load', scheduleBackgroundFxInit);
            window.addEventListener('pageshow', scheduleBackgroundFxInit);

            await fetchAiConfig();
            await initLIFF();
        }

        if (document.readyState === "loading") {
            window.addEventListener("load", initAll);
        } else {
            initAll();
        }

        function makeChoice(currentStep, key, value, btn) {
            userAstrolabeData[key] = value;
            const buttons = btn.parentElement.querySelectorAll('.btn-choice');
            buttons.forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            
            setTimeout(() => {
                document.getElementById(`step-${currentStep}`).classList.replace('active', 'exit-up');
                document.getElementById(`step-${currentStep + 1}`).classList.add('active');
            }, 300);
        }

        // 🚀 最終提交流程 (結合沉浸式彈窗與主題)
        async function submitAstrolabe() {
            // 🌟 檢查是否所有步驟都有填寫（包含新增的主題）
            if (!userAstrolabeData.topic || !userAstrolabeData.gender || !userAstrolabeData.calendar) {
                alert("宇宙訊號流失，請重新整理頁面。"); return;
            }

            const finalDate = `${document.getElementById('input-year').value}-${document.getElementById('input-month').value}-${document.getElementById('input-day').value}`;
            const time = document.getElementById('input-time').value;
            const isFuzzy = document.getElementById('toggle-fuzzy-time').checked;

            // 🌟 將用戶選擇的「領域」動態加入彈窗說明中
            const descMsg = `針對領域：【${userAstrolabeData.topic}】<br>` + 
                (isFuzzy ? "大師將針對您選擇的時段，捕捉不變的命格核心。" : "這將進行深度的 108 星曜矩陣運算。");
            
            const currentCost = (window.ziweiCost !== undefined && !isNaN(window.ziweiCost)) ? window.ziweiCost : 50; 

            showCustomConfirm("【 🏮 紫微天命羅盤 】", descMsg, currentCost, async () => {
                if (!liffReady || !currentAccessToken) {
                    alert("🚨 結界尚未就緒，請稍候數秒後再試，或關閉後從 LINE 重新開啟。");
                    return;
                }

                if (typeof sendTrackingLog === "function") {
                    sendTrackingLog("Stage 2: Ticket Created");
                }

                document.getElementById('btn-submit-main').disabled = true;
                userAstrolabeData.date = finalDate;
                userAstrolabeData.time = time; 
                
                // 🌟 步驟編號更新：從 step-4 跳到 step-5
                document.getElementById('step-4').classList.replace('active', 'exit-up');
                document.getElementById('loading-overlay').classList.add('show');
                isCalculating = true; 
                shakeAmount = 18; // 觸發震撼的羅盤震動

                const msgEl = document.getElementById('loading-msg');
                msgEl.innerText = isFuzzy ? "啟動靈能區間定盤..." : "構築 12 宮位星辰網格...";

                try {
                    setTimeout(() => { msgEl.innerText = "五行能量注入，解析阿卡西紀錄..."; }, 3500);

                    // 呼叫後端 API
                    const response = await fetch(`${ENV.API_BASE}/api/divination/ziwei`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${currentAccessToken}` },
                        body: JSON.stringify({ birthData: userAstrolabeData })
                    });

                    const result = await response.json();

                    if (result.success) {
                        document.getElementById('loading-overlay').classList.remove('show');
                        const genderStr = userAstrolabeData.gender === 'M' ? '乾造 (男命)' : '坤造 (女命)';
                        const calStr = userAstrolabeData.calendar === 'solar' ? '國曆' : '農曆';
                        BdLiff.showResultReport({
                            title: '🏮 紫微斗數解碼報告',
                            score: result.aiData.score,
                            subtitle: `占卜領域：【${userAstrolabeData.topic || '本命格局'}】`,
                            detailsHtml: `降生命造：${genderStr} · ${calStr} ${userAstrolabeData.date} ${userAstrolabeData.time}時`,
                            rawText: result.aiData.text,
                            flexMessage: result.flexMessage
                        });
                    } else {
                        throw new Error(result.msg || "解碼失敗，請稍後再試。");
                    }

                } catch (error) {
                    console.error("API 錯誤：", error);
                    alert("🚨 結界異常：" + error.message);
                    document.getElementById('loading-overlay').classList.remove('show');
                    // 因為 step-5 被刪了，如果有錯，讓它退回 step-4 重新送出
                    document.getElementById('step-4').classList.replace('exit-up', 'active');
                    document.getElementById('btn-submit-main').disabled = false;
                    isCalculating = false; 
                }
            });
        }
    </script>
